name: Build & Release OmniChat APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release"
        required: true
        default: true
        type: boolean

      release_tag:
        description: "Release tag (leave empty for automatic debug tag)"
        required: false
        type: string

      prerelease:
        description: "Mark the release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: omnichat-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  APK_PATH: "app/build/outputs/apk/debug/app-debug.apk"

jobs:
  build:
    name: Build OmniChat Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ---------------------------------------------------------
      # GRADLE
      # ---------------------------------------------------------

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-cleanup: on-success

      # ---------------------------------------------------------
      # ENVIRONMENT INFORMATION
      # ---------------------------------------------------------

      - name: Show build environment
        run: |
          echo "========================================"
          echo "OmniChat CI Build"
          echo "========================================"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          echo "Runner: $RUNNER_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Branch/Tag: $GITHUB_REF"
          echo "Run number: $GITHUB_RUN_NUMBER"
          echo ""
          echo "Java:"
          java -version
          echo ""
          echo "Gradle:"
          gradle --version

      # ---------------------------------------------------------
      # VALIDATE PROJECT
      # ---------------------------------------------------------

      - name: Validate Android project
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

          echo "Android project structure OK."

      # ---------------------------------------------------------
      # DEBUG KEYSTORE
      # ---------------------------------------------------------

      - name: Generate CI debug keystore
        run: |
          set -e

          rm -f debug.keystore

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore generated."

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------

      - name: Build Debug APK
        env:
          CI: "true"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set -o pipefail

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------

      - name: Verify APK
        run: |
          set -e

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK_PATH" | tee apk-sha256.txt

      # ---------------------------------------------------------
      # APK METADATA
      # ---------------------------------------------------------

      - name: Extract APK metadata
        id: apk
        run: |
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          echo "size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          echo "APK size: $APK_SIZE bytes"
          echo "APK SHA-256: $APK_SHA256"

      # ---------------------------------------------------------
      # FIND ALL APK FILES
      # ---------------------------------------------------------

      - name: List generated APK files
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      # ---------------------------------------------------------
      # ACTIONS ARTIFACT
      # ---------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OmniChat-debug-apk-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # BUILD SUMMARY
      # ---------------------------------------------------------

      - name: Write build summary
        run: |
          {
            echo "# 🚀 OmniChat APK Build"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Ref | $GITHUB_REF |"
            echo "| Run | #$GITHUB_RUN_NUMBER |"
            echo "| APK | $APK_PATH |"
            echo "| Size | ${{ steps.apk.outputs.size }} bytes |"
            echo "| SHA-256 | ${{ steps.apk.outputs.sha256 }} |"
            echo ""
            echo "## Artifact"
            echo ""
            echo "The APK is available in the workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------
      # DETERMINE RELEASE
      # ---------------------------------------------------------

      - name: Determine release configuration
        id: release
        shell: bash
        run: |
          CREATE_RELEASE="false"
          PRERELEASE="false"
          TAG=""

          # ---------------------------------------------
          # Version tag: v1.0.0
          # ---------------------------------------------

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then

            CREATE_RELEASE="true"
            PRERELEASE="false"
            TAG="${GITHUB_REF#refs/tags/}"

          # ---------------------------------------------
          # Normal push to main
          # ---------------------------------------------

          elif [[ "$GITHUB_EVENT_NAME" == "push" &&
                  "$GITHUB_REF" == "refs/heads/main" ]]; then

            CREATE_RELEASE="true"
            PRERELEASE="true"
            TAG="debug-${GITHUB_RUN_NUMBER}"

          # ---------------------------------------------
          # Manual workflow
          # ---------------------------------------------

          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                  "${{ inputs.create_release }}" == "true" ]]; then

            CREATE_RELEASE="true"
            PRERELEASE="${{ inputs.prerelease }}"
            TAG="${{ inputs.release_tag }}"

            if [[ -z "$TAG" ]]; then
              TAG="debug-${GITHUB_RUN_NUMBER}"
            fi

          fi

          echo "create_release=$CREATE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Create release: $CREATE_RELEASE"
          echo "Pre-release: $PRERELEASE"
          echo "Tag: $TAG"

      # ---------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ---------------------------------------------------------

      - name: Create GitHub Release
        if: steps.release.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -e

          TITLE="OmniChat $RELEASE_TAG"

          echo "Release tag: $RELEASE_TAG"
          echo "Release title: $TITLE"

          # ---------------------------------------------------
          # Create release if it doesn't already exist
          # ---------------------------------------------------

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            echo "Release already exists."
            echo "Existing release will be updated."

          else

            echo "Creating new GitHub Release..."

            if [[ "$IS_PRERELEASE" == "true" ]]; then

              gh release create "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --prerelease \
                --generate-notes

            else

              gh release create "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --generate-notes

            fi

          fi

          # ---------------------------------------------------
          # Upload APK
          # ---------------------------------------------------

          echo "Uploading APK..."

          gh release upload "$RELEASE_TAG" \
            "$APK_PATH" \
            apk-sha256.txt \
            --clobber

          echo ""
          echo "========================================"
          echo "Release successfully published"
          echo "========================================"
          echo ""
          echo "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"

      # ---------------------------------------------------------
      # RELEASE SUMMARY
      # ---------------------------------------------------------

      - name: Write release summary
        if: steps.release.outputs.create_release == 'true'
        run: |
          {
            echo ""
            echo "# 📦 GitHub Release"
            echo ""
            echo "**Tag:** ${{ steps.release.outputs.tag }}"
            echo ""
            echo "**APK:** OmniChat-debug APK"
            echo ""
            echo "**SHA-256:**"
            echo ""
            echo "${{ steps.apk.outputs.sha256 }}"
            echo ""
            echo "[Open Releases](https://github.com/${{ github.repository }}/releases)"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------
      # FAILURE DIAGNOSTICS
      # ---------------------------------------------------------

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "========================================"
          echo "BUILD FAILED - DIAGNOSTICS"
          echo "========================================"

          echo ""
          echo "Gradle processes:"
          jps -lv || true

          echo ""
          echo "Generated files:"
          find app/build -maxdepth 5 -type f 2>/dev/null | head -200 || true

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print || true

          echo ""
          echo "AAB files:"
          find . -type f -name "*.aab" -print || true
