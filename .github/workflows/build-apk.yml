name: OmniChat Android CI

on:
  # ------------------------------------------------------------
  # Build every commit pushed to main
  # Build every version tag such as v1.0.0
  # ------------------------------------------------------------
  push:
    branches:
      - main
    tags:
      - "v*"

  # ------------------------------------------------------------
  # Validate pull requests targeting main
  # ------------------------------------------------------------
  pull_request:
    branches:
      - main

  # ------------------------------------------------------------
  # Manual workflow run
  # ------------------------------------------------------------
  workflow_dispatch:

# ------------------------------------------------------------
# GitHub permissions
#
# contents: write is required to create GitHub Releases.
# ------------------------------------------------------------
permissions:
  contents: write
  pull-requests: read

# ------------------------------------------------------------
# Automatic cancellation
#
# If a newer commit arrives while an older build is still running,
# GitHub cancels the older build and keeps the newest one.
# ------------------------------------------------------------
concurrency:
  group: omnichat-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"

  DEBUG_APK: "app/build/outputs/apk/debug/app-debug.apk"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. JDK
      # ==========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ==========================================================
      # 3. Gradle
      #
      # Your repository currently uses Gradle 9.3.1 and does not
      # contain the gradlew wrapper script, so Gradle is installed
      # directly.
      #
      # setup-gradle also provides Gradle caching.
      # ==========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ==========================================================
      # 4. Environment information
      # ==========================================================
      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "OmniChat Android CI"
          echo "========================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo ""
          echo "Ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "Event:"
          echo "${GITHUB_EVENT_NAME}"

      # ==========================================================
      # 5. Generate Android debug keystore
      #
      # Your current app/build.gradle.kts explicitly expects:
      #
      # debug.keystore
      # alias = androiddebugkey
      # storePassword = android
      # keyPassword = android
      #
      # No secret/setup required.
      # ==========================================================
      - name: Generate debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f debug.keystore

          echo "Debug keystore ready."

      # ==========================================================
      # 6. Calculate automatic CI version
      #
      # Normal main/PR builds:
      #   versionCode = GitHub run number
      #   versionName = 0.0.0-ci.X
      #
      # Version tag:
      #   v1.0.0
      #   versionCode = GitHub run number
      #   versionName = 1.0.0
      #
      # This is changed only in the CI workspace.
      # Nothing is committed back to GitHub.
      # ==========================================================
      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"

            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Invalid release tag."
              echo ""
              echo "Use:"
              echo "  v1.0.0"
              echo "  v1.2.3"
              echo "  v2.0.0"
              echo ""
              echo "Received:"
              echo "  ${GITHUB_REF_NAME}"
              exit 1
            fi
          else
            VERSION_NAME="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Build Information"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Version Name | \`${VERSION_NAME}\` |"
            echo "| Version Code | \`${VERSION_CODE}\` |"
            echo "| GitHub Run | \`${GITHUB_RUN_NUMBER}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ==========================================================
      # 7. Apply CI version
      #
      # Current repository contains:
      #
      # versionCode = 1
      # versionName = "1.0"
      #
      # We temporarily replace them during CI.
      # ==========================================================
      - name: Apply CI version
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          test -f app/build.gradle.kts

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]

          text, code_count = re.subn(
              r'(\bversionCode\s*=\s*)\d+',
              rf'\g<1>{version_code}',
              text,
              count=1,
          )

          text, name_count = re.subn(
              r'(\bversionName\s*=\s*)"[^"]*"',
              rf'\g<1>"{version_name}"',
              text,
              count=1,
          )

          if code_count != 1:
              raise SystemExit(
                  "ERROR: versionCode was not found exactly once."
              )

          if name_count != 1:
              raise SystemExit(
                  "ERROR: versionName was not found exactly once."
              )

          path.write_text(text)
          PY

          echo ""
          echo "CI version applied:"
          grep -nE 'versionCode|versionName' app/build.gradle.kts

      # ==========================================================
      # 8. Gradle configuration validation
      # ==========================================================
      - name: Validate Gradle configuration
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set -euo pipefail

          gradle \
            tasks \
            --all \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 9. Build Debug APK
      # ==========================================================
      - name: Build Debug APK
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set -euo pipefail

          echo "Building OmniChat Debug APK..."

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          test -f "${DEBUG_APK}"

          echo ""
          echo "========================================"
          echo "DEBUG APK BUILD SUCCESSFUL"
          echo "========================================"
          echo ""

          ls -lh "${DEBUG_APK}"

      # ==========================================================
      # 10. Prepare artifact files
      # ==========================================================
      - name: Prepare artifacts
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK_NAME="OmniChat-${VERSION_NAME}-${VERSION_CODE}-debug.apk"

          cp "${DEBUG_APK}" "artifacts/${APK_NAME}"

          cat > artifacts/build-info.txt <<EOF
          OmniChat Android CI

          Version: ${VERSION_NAME}
          Version Code: ${VERSION_CODE}

          Build Type: DEBUG

          Repository:
          ${GITHUB_REPOSITORY}

          Commit:
          ${GITHUB_SHA}

          Ref:
          ${GITHUB_REF_NAME}

          Event:
          ${GITHUB_EVENT_NAME}

          GitHub Run:
          ${GITHUB_RUN_NUMBER}

          Workflow:
          ${GITHUB_WORKFLOW}
          EOF

          echo "Prepared files:"
          find artifacts -maxdepth 1 -type f -print

      # ==========================================================
      # 11. SHA256
      # ==========================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd artifacts

          sha256sum *.apk > SHA256SUMS.txt

          echo ""
          echo "SHA256:"
          cat SHA256SUMS.txt

      # ==========================================================
      # 12. Upload Actions artifact
      #
      # This happens for:
      #   - main commits
      #   - PRs
      #   - tags
      #   - manual runs
      # ==========================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: OmniChat-debug-${{ github.run_number }}
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
            artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # ==========================================================
      # 13. Success summary
      # ==========================================================
      - name: Build summary
        if: success()
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          APK_SIZE="$(du -h "${DEBUG_APK}" | cut -f1)"
          APK_FILE="$(basename "${DEBUG_APK}")"

          {
            echo ""
            echo "# ✅ OmniChat Build Successful"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Build | Debug APK |"
            echo "| Version | \`${VERSION_NAME}\` |"
            echo "| Version Code | \`${VERSION_CODE}\` |"
            echo "| APK | \`${APK_FILE}\` |"
            echo "| APK Size | \`${APK_SIZE}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Run | \`${GITHUB_RUN_NUMBER}\` |"
            echo ""
            echo "## 📦 Artifacts"
            echo ""
            echo "- Debug APK"
            echo "- SHA256SUMS.txt"
            echo "- build-info.txt"
            echo ""
            echo "## 🔐 Signing"
            echo ""
            echo "Android debug keystore."
            echo "No release signing key is used."
          } >> "${GITHUB_STEP_SUMMARY}"

      # ==========================================================
      # 14. CREATE GITHUB RELEASE
      #
      # ONLY executes for:
      #
      #   v1.0.0
      #   v1.2.3
      #   v2.0.0
      #
      # Normal main commits:
      #
      #   SKIPPED
      #
      # No secrets required.
      # No release APK.
      # No AAB.
      # No release signing.
      # ==========================================================
      - name: Create GitHub Release
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          APK="artifacts/OmniChat-${VERSION_NAME}-${VERSION_CODE}-debug.apk"

          test -f "${APK}"
          test -f "artifacts/SHA256SUMS.txt"
          test -f "artifacts/build-info.txt"

          echo "Creating GitHub Release..."
          echo "Tag: ${TAG}"
          echo "APK: ${APK}"

          gh release create "${TAG}" \
            "${APK}" \
            "artifacts/SHA256SUMS.txt" \
            "artifacts/build-info.txt" \
            --title "OmniChat ${TAG}" \
            --generate-notes

          echo ""
          echo "========================================"
          echo "GITHUB RELEASE CREATED"
          echo "========================================"
          echo ""
          gh release view "${TAG}"

      # ==========================================================
      # 15. Failure diagnostics
      #
      # These run ONLY if an actual earlier step failed.
      # ==========================================================
      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          mkdir -p diagnostics

          echo "Collecting diagnostics..."

          gradle --stop || true

          if [ -d "app/build/reports" ]; then
            cp -R app/build/reports diagnostics/app-build-reports
          fi

          if [ -d "app/build/outputs" ]; then
            cp -R app/build/outputs diagnostics/app-build-outputs
          fi

          if [ -d "build/reports" ]; then
            cp -R build/reports diagnostics/root-build-reports
          fi

          if [ -f "settings.gradle.kts" ]; then
            cp settings.gradle.kts diagnostics/
          fi

          if [ -f "app/build.gradle.kts" ]; then
            cp app/build.gradle.kts diagnostics/
          fi

          {
            echo "OmniChat CI Failure Diagnostics"
            echo ""
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run Number: ${GITHUB_RUN_NUMBER}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Ref: ${GITHUB_REF_NAME}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo ""
            echo "Java:"
            java -version
            echo ""
            echo "Gradle:"
            gradle --version
          } > diagnostics/environment.txt 2>&1

          find diagnostics -maxdepth 5 -type f -print || true

      # ==========================================================
      # 16. Upload diagnostics
      # ==========================================================
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: OmniChat-failure-diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      # ==========================================================
      # 17. Failure summary
      # ==========================================================
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo ""
            echo "# ❌ OmniChat Build Failed"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Run | \`${GITHUB_RUN_NUMBER}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Event | \`${GITHUB_EVENT_NAME}\` |"
            echo ""
            echo "Failure diagnostics were uploaded as an Actions artifact."
          } >> "${GITHUB_STEP_SUMMARY}"
